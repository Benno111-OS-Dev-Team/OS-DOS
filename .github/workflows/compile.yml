name: Compile OS-DOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-os-dos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile assembly sources
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Download UASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uasmZip = Join-Path $env:GITHUB_WORKSPACE 'uasm257_x86.zip'
          Invoke-WebRequest -Uri 'https://github.com/Terraspace/UASM/releases/download/v2.57r/uasm257_x86.zip' -OutFile $uasmZip
          $uasmRoot = Join-Path $env:GITHUB_WORKSPACE 'uasm'
          New-Item -ItemType Directory -Force -Path $uasmRoot | Out-Null
          Expand-Archive -Path $uasmZip -DestinationPath $uasmRoot -Force

      - name: Locate UASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uasmExe = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'uasm') -Recurse -File |
            Where-Object { $_.Name -match '^(uasm32|uasm|hjwasm)\.exe$' } |
            Select-Object -First 1

          if (-not $uasmExe) {
            throw "Could not locate a UASM executable. Found files: $((Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'uasm') -Recurse -File | Select-Object -ExpandProperty Name) -join ', ')"
          }

          "UASM_EXE=$($uasmExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Download Open Watcom
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $owExe = Join-Path $env:GITHUB_WORKSPACE 'open-watcom-c-win32-1.9.exe'
          Invoke-WebRequest -Uri 'https://github.com/open-watcom/open-watcom-1.9/releases/download/ow1.9/open-watcom-c-win32-1.9.exe' -OutFile $owExe
          Start-Process -FilePath $owExe -ArgumentList '-s' -Wait -WindowStyle Hidden
          "WATCOM=C:\WATCOM" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "C:\WATCOM\binnt" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Verify toolchain
        shell: cmd
        run: |
          where wlink || exit /b 1

      - name: Prepare build tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE
          $srcRoot = Join-Path $repoRoot 'src'
          $buildRoot = Join-Path $repoRoot 'build'
          $workSrc = Join-Path $buildRoot 'src'
          $objRoot = Join-Path $buildRoot 'obj'
          $logRoot = Join-Path $buildRoot 'logs'
          New-Item -ItemType Directory -Force -Path $workSrc, $objRoot, $logRoot | Out-Null
          Copy-Item -Path (Join-Path $srcRoot '*') -Destination $workSrc -Recurse -Force

          Copy-Item -Path (Join-Path $workSrc 'DOSMAC_v211.ASM') -Destination (Join-Path $workSrc 'DOSMAC.ASM') -Force
          Copy-Item -Path (Join-Path $workSrc 'DOSSYM_v211.ASM') -Destination (Join-Path $workSrc 'DOSSYM.ASM') -Force
          $dosmac = Get-Content -Path (Join-Path $workSrc 'DOSMAC.ASM') -Raw
          $dosmac = $dosmac -replace '(?m)^\s*JUMP\s+name\s*$', ' JMP name'
          [System.IO.File]::WriteAllText((Join-Path $workSrc 'DOSMAC.ASM'), $dosmac, [System.Text.Encoding]::ASCII)

          $comswPath = Join-Path $workSrc 'COMSW.ASM'
          $comsw = Get-Content -Path $comswPath -Raw
          $comsw = $comsw -replace '(?im)(\bEQU\s+)true\b', '$1TRUE'
          $comsw = $comsw -replace '(?im)(\bEQU\s+)false\b', '$1FALSE'
          $comsw = $comsw -replace '(?m)^FALSE\s+EQU\s+0\s*$', 'FALSE   EQU     0'
          $comsw = $comsw -replace '(?m)^TRUE\s+EQU\s+NOT\s+FALSE\s*$', 'TRUE    EQU     NOT FALSE'
          $comsw = $comsw -replace '(?m)^IBMVER\s+EQU\s+TRUE.*$', 'IBMVER  EQU     FALSE  ; CI compatibility build'
          $comsw = $comsw -replace '(?m)^IBM\s+EQU\s+IBMVER.*$', 'IBM     EQU     IBMVER'
          $comsw = $comsw -replace '(?m)^MSVER\s+EQU\s+FALSE.*$', 'MSVER   EQU     TRUE   ; CI compatibility build'
          [System.IO.File]::WriteAllText($comswPath, $comsw, [System.Text.Encoding]::ASCII)

          foreach ($asm in Get-ChildItem -Path $workSrc -Filter *.ASM -File) {
            $content = Get-Content -Path $asm.FullName -Raw
            $content = $content -replace '(?im)^\s*INCLUDE\s+DOST:DOSSYM\.ASM\s*$', 'INCLUDE DOSSYM.ASM'
            $content = $content -replace '(?im)^\s*I_am\b', 'I_AM'
            $content = $content -replace '(?im)^\s*i_am\b', 'I_AM'
            $content = $content -replace '(?im)\bi_need\b', 'I_NEED'
            $content = $content -replace '(?im)\binvoke\b', 'INVOKE'
            $content = $content -replace '(?im)\btrue\b', 'TRUE'
            $content = $content -replace '(?im)\bfalse\b', 'FALSE'

            switch ($asm.Name.ToUpperInvariant()) {
              'COMMAND.ASM' {
              }
              'MSDATA.ASM' {
                $content = $content -replace '(?m)^\s*short_addr\s+DEVIOBUF\s*$', '                short_addr  DSKCHRETBUF'
              }
              'MSINIT.ASM' {
                $content = $content -replace '(?i)\bEXTRN\s+QUIT:NEAR,IRET:NEAR,ABSDRD:FAR,ABSDWRT:FAR\b', 'EXTRN   QUIT:NEAR,IRETRTN:NEAR,ABSDRD:FAR,ABSDWRT:FAR'
                $content = $content -replace '(?i)\bOFFSET\s+DOSGROUP:IRET\b', 'OFFSET DOSGROUP:IRETRTN'
              }
              'TCODE2.ASM' {
                $content = $content -replace '(?m)^\s*EXTRN\s+OUT:NEAR,DRVBAD:NEAR,SETPATH:NEAR,PRINT:NEAR\s*$', '        EXTRN   OUT_ROUTINE:NEAR,DRVBAD:NEAR,SETPATH:NEAR,PRINT:NEAR'
                $content = $content -replace '\bCALL\s+OUT\b', 'CALL    OUT_ROUTINE'
                $content = $content -replace '\bJMP\s+OUT\b', 'JMP     OUT_ROUTINE'
              }
              'TCODE3.ASM' {
                $content = $content -replace '(?m)^\s*PUBLIC\s+GOTO,\$IF,IFERLEV,SHIFT,IFEXISTS\b', '        PUBLIC  GOTO_CMD,$IF,IFERLEV,SHIFT,IFEXISTS'
                $content = $content -replace '\bJNZ\s+IFDIF\b', 'JNZ     IFDIFF'
                $content = $content -replace '(?m)^IFDIF:$', 'IFDIFF:'
                $content = $content -replace '(?m)^GOTO:$', 'GOTO_CMD:'
              }
              'TCODE4.ASM' {
                $content = $content -replace '(?m)^\s*EXTRN\s+DISPSIZE:NEAR,OUT:NEAR,OUT2:NEAR\b', '        EXTRN   DISPSIZE:NEAR,OUT_ROUTINE:NEAR,OUT2:NEAR'
                $content = $content -replace '\bCALL\s+OUT\b', 'CALL    OUT_ROUTINE'
                $content = $content -replace '\bJMP\s+OUT\b', 'JMP     OUT_ROUTINE'
              }
              'TCODE5.ASM' {
                $content = $content -replace '(?m)^\s*PUBLIC\s+DELIM,OUT,OUT2,SETPATH,PATHCRUNCH\b', '        PUBLIC  DELIM,OUT_ROUTINE,OUT2,SETPATH,PATHCRUNCH'
                $content = $content -replace '\bCALL\s+OUT\b', 'CALL    OUT_ROUTINE'
                $content = $content -replace '\bJMP\s+OUT\b', 'JMP     OUT_ROUTINE'
                $content = $content -replace '(?m)^OUT:$', 'OUT_ROUTINE:'
              }
              'TUCODE.ASM' {
                $content = $content -replace '(?m)^\s*EXTRN\s+CRPRINT:NEAR,OUT:NEAR,ZPRINT:NEAR\b', '        EXTRN   CRPRINT:NEAR,OUT_ROUTINE:NEAR,ZPRINT:NEAR'
                $content = $content -replace '(?m)^\s*PUBLIC\s+NOTEST2,ECHO,CNTRLC,VERIFY,PRINTVOL,GetDate,PRINT_DATE\b', '        PUBLIC  NOTEST2,ECHO_CMD,CNTRLC,VERIFY,PRINTVOL,GetDate,PRINT_DATE'
                $content = $content -replace '\bCALL\s+OUT\b', 'CALL    OUT_ROUTINE'
                $content = $content -replace '\bJMP\s+OUT\b', 'JMP     OUT_ROUTINE'
                $content = $content -replace '(?m)^ECHO:$', 'ECHO_CMD:'
              }
              'TDATA.ASM' {
                $content = $content -replace '(?m)^\s*EXTRN\s+PRINT_L:NEAR,PRINT_B:NEAR,CRLF2:NEAR,OUT:NEAR,PRINT_ESC:NEAR\s*$', '        EXTRN   PRINT_L:NEAR,PRINT_B:NEAR,CRLF2:NEAR,OUT_ROUTINE:NEAR,PRINT_ESC:NEAR'
                $content = $content -replace '(?m)^\s*EXTRN\s+ADD_PROMPT:NEAR,PATH:NEAR,\$EXIT:NEAR,CTTY:NEAR,ECHO:NEAR\s*$', '        EXTRN   ADD_PROMPT:NEAR,PATH:NEAR,$EXIT:NEAR,CTTY:NEAR,ECHO_CMD:NEAR'
                $content = $content -replace '(?m)^\s*EXTRN\s+GOTO:NEAR,SHIFT:NEAR,\$IF:NEAR,\$FOR:NEAR,CLS:NEAR\s*$', '        EXTRN   GOTO_CMD:NEAR,SHIFT:NEAR,$IF:NEAR,$FOR:NEAR,CLS:NEAR'
                $content = $content -replace 'OFFSET\s+TRANGROUP:OUT\b', 'OFFSET TRANGROUP:OUT_ROUTINE'
                $content = $content -replace 'OFFSET\s+TRANGROUP:ECHO\b', 'OFFSET TRANGROUP:ECHO_CMD'
                $content = $content -replace 'OFFSET\s+TRANGROUP:GOTO\b', 'OFFSET TRANGROUP:GOTO_CMD'
              }
              'SKELIO.ASM' {
                if ($content -notmatch '(?im)^\s*RE_INIT\s+PROC\b') {
                  $content = $content -replace '(?im)^\s*DOSSPOT\s+LABEL\s+WORD\s*$', "DOSSPOT LABEL WORD`r`n`r`n        PUBLIC  RE_INIT`r`nRE_INIT PROC FAR`r`n        RET`r`nRE_INIT ENDP"
                }
              }
              'SYSIMES.ASM' {
                $content = $content -replace '(?im)^\s*PUBLIC\s+BADOPM,CRLFM,BADSIZ,BADLD,BADCOM,SYSSIZE\s*$', '        PUBLIC  BADOPM,CRLFM,BADSIZ,BADLD,BADCOM,SYSSIZE,BADSIZ_PRE,BADSIZ_POST,BADLD_PRE,BADLD_POST,BADCOUNTRY'
                if ($content -notmatch '(?im)^\s*BADSIZ_PRE\s+EQU\s+') {
                  $content = $content -replace '(?im)^\s*SYSSIZE\s+LABEL\s+BYTE\s*$', "BADSIZ_PRE EQU BADSIZ`r`nBADSIZ_POST EQU CRLFM`r`nBADLD_PRE EQU BADLD`r`nBADLD_POST EQU CRLFM`r`nBADCOUNTRY EQU BADOPM`r`n`r`nSYSSIZE LABEL BYTE"
                }
              }
              'DIR.ASM' {
                $content = $content -replace '\bSHORT\s+RETF\b', 'SHORT RETFOUND'
                $content = $content -replace '\bJZ\s+RETF\b', 'JZ      RETFOUND'
                $content = $content -replace '(?m)^RETF:$', 'RETFOUND:'
              }
              'BUF.ASM' {
                $content = $content -replace '\bNRETIBM\b', 'NRET2'
              }
              'STRIN.ASM' {
                # OUT_ROUTINE, TAB, $STD_CON_INPUT_NO_ECHO are defined locally in
                # IO.ASM which includes STRIN.ASM -- remove the EXTRN to avoid error.
                $content = $content -replace '(?m)^\s*EXTRN\s+OUT_ROUTINE:NEAR,TAB:NEAR,\$STD_CON_INPUT_NO_ECHO:NEAR\s*$', ''
              }
            }

            [System.IO.File]::WriteAllText($asm.FullName, $content, [System.Text.Encoding]::ASCII)
          }

          function Get-ModuleNames {
            param([string]$Path)
            $text = Get-Content -Path $Path -Raw
            $text = $text -replace '\r?\n', ' '
            $text = $text -replace '\s*\+\s*', ' '
            $text = $text -replace ';', ' '
            return $text -split '\s+' | Where-Object { $_ }
          }

          $modules = @(
            (Get-ModuleNames (Join-Path $srcRoot 'COMLINK'))
            (Get-ModuleNames (Join-Path $srcRoot 'DOSLINK'))
            'SKELIO'
            'SYSINIT'
            'SYSIMES'
            'SYS'
            'SYSMES'
            'EXE2BIN'
            'EXEMES'
          ) | ForEach-Object { $_.ToUpperInvariant() } | Select-Object -Unique

          $modules | Set-Content -Path (Join-Path $buildRoot 'modules.txt')

      - name: Compile modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE
          $workSrc = Join-Path $repoRoot 'build\src'
          $objRoot = Join-Path $repoRoot 'build\obj'
          $logRoot = Join-Path $repoRoot 'build\logs'
          $assembler = $env:UASM_EXE
          $modules = Get-Content -Path (Join-Path $repoRoot 'build\modules.txt')

          $failures = New-Object System.Collections.Generic.List[string]
          foreach ($module in $modules) {
            $asmPath = Join-Path $workSrc "$module.ASM"
            $objPath = Join-Path $objRoot "$module.obj"
            $logPath = Join-Path $logRoot "$module.log"

            Write-Host "Assembling $module"
            $extraArgs = @('/Zm')
            $prefix = "OPTION CASEMAP:ALL`r`n"
            $commandText = [System.IO.File]::ReadAllText($asmPath, [System.Text.Encoding]::ASCII)
            [System.IO.File]::WriteAllText($asmPath, $prefix + $commandText, [System.Text.Encoding]::ASCII)
            & $assembler @extraArgs /c /nologo /Cp /Fo"$objPath" "$asmPath" 2>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -ne 0) {
              $failures.Add($module)
            }
          }

          if ($failures.Count -gt 0) {
            Write-Host "Compile failed for:"
            $failures | ForEach-Object { Write-Host " - $_" }
            exit 1
          }

          Write-Host "Compile completed successfully."

      - name: Stage COM startup object
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE
          $objRoot = Join-Path $repoRoot 'build\obj'
          $asmRoot = Join-Path $repoRoot 'build\src'
          $watcomRoot = Split-Path -Path (Split-Path -Path (Get-Command wlink).Source -Parent) -Parent
          $cstartObj = Join-Path $watcomRoot 'lib286\dos\cstart_t.obj'

          if (Test-Path -LiteralPath $cstartObj) {
            Copy-Item -LiteralPath $cstartObj -Destination (Join-Path $objRoot 'cstart_t.obj') -Force
          } else {
            $stubAsm = Join-Path $asmRoot 'cstart_t.asm'
            $stubObj = Join-Path $objRoot 'cstart_t.obj'
            $stubLines = @(
              '.286'
              '.model tiny'
              '.code'
              '_cstart_:'
              '_Not_Enough_Memory_:'
              '__exit_:'
              '__do_exit_with_msg__:'
              '__GETDS:'
              '    ret'
              'END _cstart_'
            )
            $stubLines | Set-Content -LiteralPath $stubAsm -Encoding ASCII
            & $env:UASM_EXE /c /nologo /Cp /Fo"$stubObj" "$stubAsm"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to build fallback cstart_t.obj at $stubObj"
            }
          }

      - name: Link deliverables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE
          $objRoot = Join-Path $repoRoot 'build\obj'
          $distRoot = Join-Path $repoRoot 'dist'
          $logRoot = Join-Path $repoRoot 'build\logs'
          $wlinkExe = (Get-Command wlink).Source
          $watcomRoot = Split-Path -Path (Split-Path -Path $wlinkExe -Parent) -Parent
          $env:WATCOM = $watcomRoot

          New-Item -ItemType Directory -Force -Path $distRoot | Out-Null

          function Get-ModuleNames {
            param([string]$Path)
            $text = Get-Content -Path $Path -Raw
            $text = $text -replace '\r?\n', ' '
            $text = $text -replace '\s*\+\s*', ' '
            $text = $text -replace ';', ' '
            return $text -split '\s+' | Where-Object { $_ }
          }

          function Link-Group {
            param(
              [string]$OutputName,
              [string[]]$Modules,
              [ValidateSet('com', 'dos')]
              [string]$System
            )

            $objArgs = $Modules | ForEach-Object { Join-Path $objRoot "$_.obj" }
            $outPath = Join-Path $distRoot $OutputName
            $logPath = Join-Path $logRoot "$OutputName.link.log"
            $linkPath = Join-Path $logRoot "$OutputName.lnk"
            $linkScript = @('option quiet', "name $outPath")
            $fileArgs = @()
            $fileArgs += $objArgs
            if ($System -eq 'com') {
              $linkScript += 'system begin osdoscom'
              $linkScript += "  option osname='DOS .COM'"
              $linkScript += "  libpath $objRoot"
              $linkScript += "  libpath $watcomRoot\lib286"
              $linkScript += "  libpath $watcomRoot\lib286\dos"
              $linkScript += '  format dos com'
              $linkScript += 'end'
              $linkScript += 'system osdoscom'
            } else {
              $linkScript += 'system begin osdosdos'
              $linkScript += "  option osname='DOS EXE'"
              $linkScript += "  libpath $objRoot"
              $linkScript += "  libpath $watcomRoot\lib286"
              $linkScript += "  libpath $watcomRoot\lib286\dos"
              $linkScript += '  format dos'
              $linkScript += 'end'
              $linkScript += 'system osdosdos'
            }
            $linkScript += "file $($fileArgs -join ', ')"
            Set-Content -Path $linkPath -Value $linkScript -Encoding ASCII
            Write-Host "Linking $OutputName"
            & $wlinkExe "@$linkPath" 2>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -ne 0) {
              throw "Link failed for $OutputName"
            }
          }

          $commandModules = Get-ModuleNames (Join-Path $repoRoot 'src\COMLINK') | ForEach-Object { $_.ToUpperInvariant() }
          $dosModules = Get-ModuleNames (Join-Path $repoRoot 'src\DOSLINK') | ForEach-Object { $_.ToUpperInvariant() }
          Link-Group -OutputName 'COMMAND.COM' -Modules $commandModules -System 'com'
          Link-Group -OutputName 'MSDOS.SYS' -Modules $dosModules -System 'dos'
          Link-Group -OutputName 'IO.SYS' -Modules @('SKELIO','SYSINIT','SYSIMES') -System 'dos'
          Link-Group -OutputName 'SYS.EXE' -Modules @('SYS','SYSMES') -System 'dos'
          Link-Group -OutputName 'EXE2BIN.EXE' -Modules @('EXE2BIN','EXEMES') -System 'dos'

      - name: Build boot image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE
          $distRoot = Join-Path $repoRoot 'dist'
          $py = @'
          import math
          import os
          from pathlib import Path

          dist = Path(os.environ["GITHUB_WORKSPACE"]) / "dist"
          image_path = dist / "OSDOS-BOOT-1.44M.img"

          # FAT12 1.44MB geometry
          bps = 512
          total_sectors = 2880
          sectors_per_cluster = 1
          reserved_sectors = 1
          num_fats = 2
          root_entries = 224
          sectors_per_fat = 9
          root_dir_sectors = (root_entries * 32 + (bps - 1)) // bps
          first_data_sector = reserved_sectors + num_fats * sectors_per_fat + root_dir_sectors
          data_sectors = total_sectors - first_data_sector
          total_clusters = data_sectors // sectors_per_cluster

          files = [
              ("IO.SYS", 0x06),
              ("MSDOS.SYS", 0x06),
              ("COMMAND.COM", 0x20),
              ("SYS.EXE", 0x20),
              ("EXE2BIN.EXE", 0x20),
          ]

          file_data = []
          for name, attr in files:
              p = dist / name
              data = p.read_bytes()
              clusters = max(1, math.ceil(len(data) / (bps * sectors_per_cluster)))
              file_data.append((name, attr, data, clusters))

          # Allocate clusters contiguously
          next_cluster = 2
          allocation = []
          for name, attr, data, clusters in file_data:
              start = next_cluster
              chain = list(range(start, start + clusters))
              next_cluster += clusters
              allocation.append((name, attr, data, chain))

          if next_cluster - 2 > total_clusters:
              raise RuntimeError("Not enough space for files in 1.44MB image")

          io_name, io_attr, io_data, io_chain = allocation[0]
          if io_name.upper() != "IO.SYS":
              raise RuntimeError("IO.SYS must be first in allocation for bootstrap loader")
          io_start_lba = first_data_sector + (io_chain[0] - 2) * sectors_per_cluster
          # DOS-style bootstrap handoff: load only the initial IO.SYS bootstrap
          # sectors and jump into it. The remainder is loaded by system init code.
          io_sector_count = min(3, len(io_chain) * sectors_per_cluster)

          image = bytearray(total_sectors * bps)

          # Boot sector (FAT12 BPB + bootstrap that loads IO.SYS and jumps to it)
          bs = bytearray(512)
          bs[0:3] = b"\xEB\x3C\x90"
          bs[3:11] = b"MSDOS5.0"
          bs[11:13] = (bps).to_bytes(2, "little")
          bs[13] = sectors_per_cluster
          bs[14:16] = (reserved_sectors).to_bytes(2, "little")
          bs[16] = num_fats
          bs[17:19] = (root_entries).to_bytes(2, "little")
          bs[19:21] = (total_sectors).to_bytes(2, "little")
          bs[21] = 0xF0
          bs[22:24] = (sectors_per_fat).to_bytes(2, "little")
          bs[24:26] = (18).to_bytes(2, "little")   # sectors/track
          bs[26:28] = (2).to_bytes(2, "little")    # heads
          bs[28:32] = (0).to_bytes(4, "little")    # hidden sectors
          bs[32:36] = (0).to_bytes(4, "little")    # big total sectors
          bs[36] = 0x00
          bs[37] = 0x00
          bs[38] = 0x29
          bs[39:43] = (0x12345678).to_bytes(4, "little")
          bs[43:54] = b"OSDOSBOOT  "
          bs[54:62] = b"FAT12   "
          boot_code = bytearray([
              0xFA,0x31,0xC0,0x8E,0xD8,0x8E,0xD0,0xBC,0x00,0x7C,0xFB,0x88,0x16,0xC2,0x7C,0x8B,
              0x2E,0xC3,0x7C,0x8B,0x3E,0xC5,0x7C,0xB8,0x70,0x00,0x8E,0xC0,0x31,0xDB,0xBE,0xC7,
              0x7C,0xE8,0x54,0x00,0x83,0xFF,0x00,0x74,0x3A,0x89,0xE8,0x31,0xD2,0xBE,0x12,0x00,
              0xF7,0xF6,0x88,0xD1,0xFE,0xC1,0x31,0xD2,0xBE,0x02,0x00,0xF7,0xF6,0x88,0xC5,0x88,
              0xD6,0x8A,0x16,0xC2,0x7C,0xB8,0x01,0x02,0xCD,0x13,0x72,0x22,0xB0,0x2E,0xB4,0x0E,
              0xCD,0x10,0x81,0xC3,0x00,0x02,0x73,0x07,0x8C,0xC0,0x83,0xC0,0x20,0x8E,0xC0,0x45,
              0x4F,0xEB,0xC1,0xBE,0xD7,0x7C,0xE8,0x0F,0x00,0xEA,0x00,0x00,0x70,0x00,0xBE,0xEA,
              0x7C,0xE8,0x04,0x00,0xFA,0xF4,0xEB,0xFC,0xAC,0x08,0xC0,0x74,0x06,0xB4,0x0E,0xCD,
              0x10,0xEB,0xF5,0xC3,0x00,0xAA,0xAA,0xBB,0xBB,0x4C,0x6F,0x61,0x64,0x69,0x6E,0x67,
              0x20,0x49,0x4F,0x2E,0x53,0x59,0x53,0x20,0x00,0x0D,0x0A,0x42,0x6F,0x6F,0x74,0x69,
              0x6E,0x67,0x20,0x49,0x4F,0x2E,0x53,0x59,0x53,0x0D,0x0A,0x00,0x0D,0x0A,0x44,0x69,
              0x73,0x6B,0x20,0x72,0x65,0x61,0x64,0x20,0x65,0x72,0x72,0x6F,0x72,0x0D,0x0A,0x00
          ])
          # Patch placeholders in boot code:
          #   0xAAAA -> start LBA (IO.SYS first sector)
          #   0xBBBB -> IO.SYS sector count
          boot_code[133:135] = io_start_lba.to_bytes(2, "little")
          boot_code[135:137] = io_sector_count.to_bytes(2, "little")
          bs[62:62 + len(boot_code)] = boot_code
          bs[510:512] = b"\x55\xAA"
          image[0:512] = bs

          # FAT12 table
          fat = bytearray(sectors_per_fat * bps)
          fat[0] = 0xF0
          fat[1] = 0xFF
          fat[2] = 0xFF

          def set_fat12_entry(cluster, value):
              offset = (cluster * 3) // 2
              if cluster & 1:
                  fat[offset] = (fat[offset] & 0x0F) | ((value << 4) & 0xF0)
                  fat[offset + 1] = (value >> 4) & 0xFF
              else:
                  fat[offset] = value & 0xFF
                  fat[offset + 1] = (fat[offset + 1] & 0xF0) | ((value >> 8) & 0x0F)

          for _, _, _, chain in allocation:
              for i, cluster in enumerate(chain):
                  nxt = 0xFFF if i == len(chain) - 1 else chain[i + 1]
                  set_fat12_entry(cluster, nxt)

          fat1_start = reserved_sectors * bps
          fat2_start = (reserved_sectors + sectors_per_fat) * bps
          image[fat1_start:fat1_start + len(fat)] = fat
          image[fat2_start:fat2_start + len(fat)] = fat

          # Root directory
          root_start = (reserved_sectors + num_fats * sectors_per_fat) * bps
          root = bytearray(root_dir_sectors * bps)

          def dos_name(name):
              n, e = name.split(".")
              return (n[:8].ljust(8) + e[:3].ljust(3)).encode("ascii")

          for idx, (name, attr, data, chain) in enumerate(allocation):
              e = bytearray(32)
              e[0:11] = dos_name(name.upper())
              e[11] = attr
              # Leave timestamps zero for reproducibility
              e[26:28] = chain[0].to_bytes(2, "little")
              e[28:32] = len(data).to_bytes(4, "little")
              root[idx * 32:(idx + 1) * 32] = e

          image[root_start:root_start + len(root)] = root

          # Data area
          for _, _, data, chain in allocation:
              for i, cluster in enumerate(chain):
                  sector = first_data_sector + (cluster - 2) * sectors_per_cluster
                  off = sector * bps
                  chunk = data[i * bps:(i + 1) * bps]
                  image[off:off + len(chunk)] = chunk

          image_path.write_bytes(image)
          print(f"Created {image_path} ({len(image)} bytes)")
          print("Included files:", ", ".join(n for n, *_ in allocation))
          '@
          $py | python -

      - name: Upload object files
        uses: actions/upload-artifact@v4
        with:
          name: os-dos-images-${{ github.run_number }}
          path: dist
          if-no-files-found: error
