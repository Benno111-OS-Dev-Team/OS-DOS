
name: Build OS-DOS

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-dos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            cmake \
            ninja-build \
            nasm \
            yasm \
            mtools \
            dosfstools \
            xorriso \
            qemu-system-x86

      - name: Detect project files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f Makefile ] || [ -f makefile ]; then
            make
          elif [ -f build.sh ]; then
            chmod +x build.sh
            ./build.sh
          elif [ -f CMakeLists.txt ]; then
            cmake -S . -B build -G Ninja
            cmake --build build
          else
            echo "No Makefile, build.sh, or CMakeLists.txt found."
            echo "Nothing to build yet."
          fi

      - name: Collect outputs
        shell: bash
        run: |
          mkdir -p dist

          find . -type f \( \
            -name "*.bin" -o \
            -name "*.img" -o \
            -name "*.iso" -o \
            -name "*.elf" -o \
            -name "*.com" -o \
            -name "*.exe" \
          \) -not -path "./dist/*" -exec cp --parents {} dist/ \;

          if [ -z "$(find dist -type f)" ]; then
            echo "No build outputs found, adding source snapshot."
            tar --exclude=.git --exclude=dist -czf dist/os-dos-source.tar.gz .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-dos-build
          path: dist/
          if-no-files-found: error

  release:
    name: Release package
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: os-dos-build
          path: dist

      - name: Create release archive
        run: |
          tar -czf os-dos-${{ github.ref_name }}.tar.gz -C dist .

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: os-dos-${{ github.ref_name }}.tar.gz
