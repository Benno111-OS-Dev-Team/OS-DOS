name: Build OS-DOS

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-dos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DOS layer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Verify tools
        shell: cmd
        run: |
          where nmake
          where ml
          where cl
          where link

      - name: Build OS-DOS
        working-directory: src
        shell: cmd
        env:
          INIT: ${{ github.workspace }}\src\TOOLS
          COUNTRY: USA
        run: |
          nmake /f MAKEFILE

      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $patterns = @(
            '*.com','*.exe','*.sys','*.bin',
            '*.obj','*.lib','*.map',
            '*.lst','*.cod','*.idx','*.msg','*.ctl','*.cl1'
          )

          foreach ($pattern in $patterns) {
            Get-ChildItem -Path src -Recurse -File -Filter $pattern |
              Where-Object { $_.FullName -notmatch '\\dist\\' } |
              Copy-Item -Destination dist -Force
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: os-dos-build-${{ github.run_number }}
          path: dist
          if-no-files-found: warn
