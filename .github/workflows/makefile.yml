name: Build OS-DOS

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-dos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DOS layer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Verify toolchain
        shell: cmd
        run: |
          echo === TOOL CHECK ===
          where nmake || exit /b 1
          where ml || exit /b 1
          where link || exit /b 1
          where cl || exit /b 1

      - name: Setup environment
        shell: cmd
        run: |
          echo === ENV SETUP ===
          set INIT=%CD%\src\TOOLS
          set COUNTRY=USA
          set PATH=%CD%\src\TOOLS;%PATH%
          echo INIT=%INIT%
          echo PATH=%PATH%

      - name: Clean previous builds
        working-directory: src
        shell: cmd
        run: |
          if exist *.obj del /s /q *.obj
          if exist *.exe del /s /q *.exe
          if exist *.com del /s /q *.com

      - name: Build OS-DOS
        working-directory: src
        shell: cmd
        run: |
          echo === BUILD START ===
          nmake /f MAKEFILE || exit /b 1

      - name: Verify outputs
        shell: pwsh
        run: |
          Write-Host "=== OUTPUT CHECK ==="
          $outputs = Get-ChildItem -Path src -Recurse -Include *.com, *.exe, *.sys -File
          if ($outputs.Count -eq 0) {
            Write-Error "❌ No build outputs found!"
            exit 1
          }
          $outputs | ForEach-Object { Write-Host $_.FullName }

      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Get-ChildItem -Path src -Recurse -Include *.com, *.exe, *.sys, *.bin -File |
            Copy-Item -Destination dist -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: os-dos-build-${{ github.run_number }}
          path: dist
          if-no-files-found: error
